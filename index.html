<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Red Space - a fast 3D endless flyer game. Dodge obstacles, grab rings, and survive as long as you can!">
    <meta name="keywords" content="3D game, endless flyer, browser game, Red Space, dodge game">
    <meta property="og:title" content="Red Space">
    <meta property="og:description" content="Dodge obstacles, grab rings, survive as long as you can in this fast 3D endless flyer.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#000000">
    <meta property="og:url" content="https://reddspace.vercel.app">
    <meta property="og:image" content="https://reddspace.vercel.app/favicon.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Red Space">
    <meta name="twitter:description" content="Dodge obstacles, grab rings, survive as long as you can in this fast 3D endless flyer.">
    <meta name="twitter:image" content="https://reddspace.vercel.app/favicon.png">

    <title>Red Space</title>
    <link rel="canonical" href="https://reddspace.vercel.app">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startScreen">
        <h1>Red Space</h1>
        <p>Dodge obstacles, grab rings, survive as long as you can!</p>
        <button id="playBtn">Play</button>
    </div>
    <div id="score">Score: 0</div>
    <div id="joystickZone">
        <div id="joystickStick"></div>
    </div>
    <div id="gameOver" style="display:none;">
        <h1>Game Over</h1>
        <p id="finalScore"></p>
        <button id="restartBtn">Restart</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
